<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddle Tablets</title>
    <link rel="icon" type="image/png" href="/images/emerald_tablet.png">
    <link rel="preload" href="/audio/noita-game-over.mp3?v=2" as="audio" type="audio/mpeg">
    <link rel="preload" href="/audio/noita-ancient-01.mp3?v=1" as="audio" type="audio/mpeg">
    <link rel="preload" href="/audio/noita-ancient-02.mp3?v=1" as="audio" type="audio/mpeg">
    <link rel="preload" href="/audio/noita-tablet-open-orb.mp3?v=1" as="audio" type="audio/mpeg">
    <link rel="stylesheet" href="/style.css?v=30">
</head>
<body class="archive-page">
    <main class="archive-container">
        <section id="waiting-state" class="archive-empty waiting-state hidden" aria-live="polite">
            <div class="longleg-stage" aria-hidden="true">
                <span class="longleg-sprite"></span>
            </div>
            <h1>Hamis Waits</h1>
            <p>No new topic has awakened.</p>
        </section>

        <section id="active-topic" class="topic-section hidden" aria-labelledby="active-topic-heading">
            <h1 id="active-topic-heading" class="topic-heading"></h1>
            <div id="tablet-grid" class="tablet-grid" aria-live="polite"></div>
            <div class="topic-completion-actions">
                <button id="solve-topic-button" class="solve-topic-button sampo-solve-button hidden" type="button" aria-describedby="solve-topic-flavor">
                    <img src="/images/sampo.png" alt="" aria-hidden="true">
                    <span>Mark topic as solved</span>
                    <small id="solve-topic-flavor">There's no undo button.</small>
                </button>
            </div>
        </section>

        <div id="solved-topics" class="solved-topics hidden" aria-live="polite"></div>

        <section id="topic-error" class="archive-empty hidden">
            <div class="archive-empty-mark" aria-hidden="true">✦</div>
            <h1>The tablets could not be summoned</h1>
            <p>Return when the archive is reachable.</p>
        </section>

        <section id="topic-archive" class="topic-archive hidden" aria-labelledby="topic-archive-heading">
            <header class="topic-archive-header">
                <p class="eyebrow">Previously revealed</p>
                <h1 id="topic-archive-heading">Past topics</h1>
                <a href="/" class="text-link">Return to the current topic</a>
            </header>
            <div id="topic-archive-list" class="topic-archive-list"></div>
        </section>

    </main>

    <div id="completion-celebration" class="completion-celebration" role="dialog" aria-modal="true" aria-label="Topic solved" aria-hidden="true">
        <button id="completion-close" class="completion-close" type="button" aria-label="Close celebration">&times;</button>
        <span class="completion-pulse" aria-hidden="true"></span>
        <p id="completion-title" class="completion-title" role="status" aria-live="assertive"></p>
    </div>
    <audio id="completion-sound" preload="auto" aria-hidden="true">
        <source src="/audio/noita-game-over.mp3?v=2" type="audio/mpeg">
    </audio>
    <audio id="ancient-sound" preload="auto" aria-hidden="true"></audio>
    <audio id="tablet-open-sound" preload="auto" aria-hidden="true">
        <source src="/audio/noita-tablet-open-orb.mp3?v=1" type="audio/mpeg">
    </audio>
    <script type="module" src="/gallery.js?v=25"></script>
</body>
</html>
