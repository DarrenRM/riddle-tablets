<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablets</title>
    <link rel="stylesheet" href="/style.css?v=11">
</head>
<body class="archive-page">
    <main class="archive-container">
        <div id="tablet-grid" class="tablet-grid" aria-live="polite"></div>
        <section id="completed-section" class="completed-section hidden" aria-labelledby="completed-heading">
            <h2 id="completed-heading">Completed inscriptions</h2>
            <div id="completed-tablet-grid" class="tablet-grid"></div>
        </section>
        <section id="archive-empty" class="archive-empty hidden">
            <div class="archive-empty-mark" aria-hidden="true">✦</div>
            <h1>No tablets have been inscribed</h1>
            <p>The archive waits in silence.</p>
        </section>
    </main>
    <div id="completion-celebration" class="completion-celebration" aria-hidden="true">
        <span class="completion-pulse" aria-hidden="true"></span>
        <p id="completion-title" class="completion-title" role="status" aria-live="assertive"></p>
    </div>
    <audio id="completion-sound" preload="auto" aria-hidden="true">
        <source src="/audio/noita-game-over.mp3" type="audio/mpeg">
    </audio>
    <script type="module" src="/gallery.js?v=8"></script>
</body>
</html>
